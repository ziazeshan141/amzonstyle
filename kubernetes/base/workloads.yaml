apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: amazon-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: YOUR_ECR_REPO/auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: service-urls
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: amazon-secrets
              key: jwt-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: amazon-demo
spec:
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: 3001
---

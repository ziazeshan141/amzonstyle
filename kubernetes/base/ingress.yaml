apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amazon-demo
  namespace: amazon-demo
spec:
  ingressClassName: nginx
  rules:
  - host: amazon-demo.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
